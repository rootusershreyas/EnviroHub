services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: envirohub
      POSTGRES_PASSWORD: envirohub_dev
      POSTGRES_DB: envirohub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envirohub -d envirohub"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data: